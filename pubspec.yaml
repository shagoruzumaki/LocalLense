name: local_lense
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  app_links: ^6.0.0
  image_picker: ^1.1.2
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  url_launcher: ^6.2.0
  flutter_local_notifications: ^18.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: ArialUnicode
      fonts:
        - asset: assets/fonts/ArialUnicode.ttf
    - family: SegoeUiEmoji
      fonts:
        - asset: assets/fonts/SegoeUiEmoji.ttf
